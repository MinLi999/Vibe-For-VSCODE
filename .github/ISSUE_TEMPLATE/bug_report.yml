name: Bug report / 问题反馈
description: Something broken in the macOS app or server / macOS 端或服务端出了问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 中文或英文都可以，怎么顺手怎么来。/ Chinese or English — whichever is easier for you.
  - type: dropdown
    id: component
    attributes:
      label: Component / 组件
      options:
        - macOS app (macos/)
        - Server / Worker (server/)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 发生了什么？
      description: What did you do, what did you expect, what happened instead? / 你做了什么、预期是什么、实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: |
        macOS version:
        Hosted backend or self-hosted?
        Transcription engine (hosted / groq / openai / aliyun / custom):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / 日志与截图
      description: |
        Menu bar error banner text, or the last few entries from Settings → 诊断 (Diagnostics).
        菜单栏的错误提示文字，或设置页「诊断」区最近几条事件记录。
        ⚠️ 千万不要贴出 API Key 或 License Key。/ Never paste API keys or license keys.
