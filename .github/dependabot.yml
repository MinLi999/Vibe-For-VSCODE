version: 2
updates:
  # One entry per workspace — this repo has two independent package.json files
  # (macos/ is Swift Package Manager, not npm).
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
