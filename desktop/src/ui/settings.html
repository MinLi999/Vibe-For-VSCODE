<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' mediastream:" />
<title>VibeFox 设置</title>
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
    --line: #e3e3e6; --accent: #e8590c; --accent-soft: #fff0e6;
    --ok: #2f9e44; --warn: #e8590c; --danger: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20; --panel: #2a2a2d; --text: #f2f2f4; --muted: #98989f;
      --line: #3a3a3e; --accent: #ff8a3d; --accent-soft: #3a2a1e;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 4px; padding: 10px 16px 0;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
  }
  header .brand { font-weight: 700; font-size: 15px; margin-right: 16px; padding-bottom: 10px; }
  header .brand .fox { margin-right: 6px; }
  nav { display: flex; gap: 2px; }
  nav button {
    appearance: none; border: none; background: none; color: var(--muted);
    font: inherit; font-weight: 500; padding: 8px 14px 10px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav button:hover { color: var(--text); }
  header .phase { margin-left: auto; padding-bottom: 10px; color: var(--muted); font-size: 12px; }
  header .phase.recording { color: var(--danger); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 18px 20px 32px; }
  section.tab { display: none; max-width: 820px; margin: 0 auto; }
  section.tab.active { display: block; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
  }
  .card .num { font-size: 22px; font-weight: 700; }
  .card .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h3 { font-size: 13px; margin-bottom: 10px; }
  .panel h3 .hint { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .row label.field { min-width: 130px; color: var(--muted); }
  input[type=text], input[type=password], input[type=number], select, textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; outline: none; user-select: text; -webkit-user-select: text;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  button.btn {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { filter: brightness(1.08); color: #fff; }
  button.btn.danger { color: var(--danger); }
  button.btn:disabled { opacity: .45; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td .alias { color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px;
    background: var(--accent-soft); color: var(--accent); margin-left: 6px;
  }
  .list-item { display: flex; align-items: baseline; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .list-item .when { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .list-item .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; -webkit-user-select: text; }
  .list-item:hover { background: var(--accent-soft); border-radius: 6px; cursor: pointer; }
  .radio-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .radio-card { border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .radio-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .radio-card .t { font-weight: 600; }
  .radio-card .d { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .status-ok { color: var(--ok); font-weight: 600; }
  .status-warn { color: var(--warn); font-weight: 600; }
  .muted { color: var(--muted); }
  .meter { height: 10px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; flex: 1; }
  .meter > div { height: 100%; width: 0; background: var(--ok); transition: width 80ms linear; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); border-radius: 8px; padding: 8px 18px;
    font-size: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60;
  }
  #toast.show { opacity: .92; }
  /* Onboarding overlay */
  #onboarding {
    position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
  }
  #onboarding[hidden] { display: none; }
  #onboarding .step { max-width: 560px; width: 100%; text-align: center; }
  #onboarding h1 { font-size: 22px; margin-bottom: 10px; }
  #onboarding p.lead { color: var(--muted); margin-bottom: 22px; }
  #onboarding .body { text-align: left; margin-bottom: 22px; }
  #onboarding .nav { display: flex; justify-content: center; gap: 10px; }
  #onboarding .dots { margin-top: 26px; color: var(--muted); letter-spacing: 4px; }
  #onboarding textarea { width: 100%; min-height: 120px; resize: vertical; }
  .sample { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; font-size: 12.5px; }
  .sample b { color: var(--accent); margin-right: 6px; }
  kbd {
    font: 12px ui-monospace, monospace; background: var(--panel); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 1px 7px;
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="fox">🦊</span>VibeFox</div>
    <nav id="tabs">
      <button data-tab="home">首页</button>
      <button data-tab="dict">词库</button>
      <button data-tab="style">风格</button>
      <button data-tab="settings">设置</button>
    </nav>
    <div class="phase" id="phase"></div>
  </header>
  <main>
    <section class="tab" id="tab-home"></section>
    <section class="tab" id="tab-dict"></section>
    <section class="tab" id="tab-style"></section>
    <section class="tab" id="tab-settings"></section>
  </main>
  <div id="onboarding" hidden></div>
  <div id="toast"></div>
  <script src="./settings.js"></script>
</body>
</html>
